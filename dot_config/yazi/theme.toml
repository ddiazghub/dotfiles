# : Manager [[[

[mgr]
cwd = { fg = "#e1e2e6" }

# Tab
tab_active = { fg = "#003353", bg = "#99cbfd", bold = true }
tab_inactive = { fg = "#cee5ff", bg = "#001d32" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#ffb04c", bg = "#ffb04c" }
marker_cut = { fg = "#ffddb2", bg = "#ffddb2" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#f5bd6c", bg = "#f5bd6c" }

# Count
count_copied = { fg = "#291800", bg = "#ffddb2" }
count_cut = { fg = "#291800", bg = "#ffddb2" }
count_selected = { fg = "#003353", bg = "#f5bd6c" }

# Border
border_symbol = " "
border_style  = { fg = "#99cbfd" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#003353", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#99cbfd", fg = "#003353", bold = true }
normal_alt  = { bg = "#41474e", fg = "#c1c7cf" }

# Select mode
select_main = { bg = "#b6c8de", fg = "#203243", bold = true }
select_alt  = { bg = "#41474e", fg = "#c1c7cf" }

# Unset mode
unset_main = { bg = "#f5bd6c", fg = "#452b00", bold = true }
unset_alt  = { bg = "#41474e", fg = "#c1c7cf" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#99cbfd", bg = "#37393d" }
progress_error = { fg = "#ffb4ab", bg = "#37393d" }

# Permissions
permissions_t = { fg = "#4e79ad" }
permissions_w = { fg = "#bb740d" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#ff9919" }
permissions_s = { fg = "#3594ff" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#99cbfd" }
active = { fg = "#f5bd6c", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#99cbfd" }
value = { fg = "#e1e2e6" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#99cbfd", bold = true, bg = "#111416" }
inactive = { fg = "#b6c8de", bg = "#111416" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#99cbfd", bg = "#003353" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#99cbfd" }
title = {}
hovered = { fg = "#ffddb2", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#37393d" }
cand = { fg = "#99cbfd" }
rest = { fg = "#003353" }
desc = { fg = "#e1e2e6" }
separator = " ▶ "
separator_style = { fg = "#e1e2e6" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#e1e2e6" }
run = { fg = "#e1e2e6" }
footer = { fg = "#203243", bg = "#b6c8de" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#f5bd6c" }
title_warn = { fg = "#99cbfd" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { name = "*", fg = "#e1e2e6" },
    { name = "*/", fg = "#99cbfd" },
]

# : ]]]
